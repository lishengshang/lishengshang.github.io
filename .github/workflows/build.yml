# 收到 homepage 仓库的 sync 通知后，拉取其最新代码构建并部署到 GitHub Pages
name: Deploy

on:
  repository_dispatch:
    types: [sync]
  workflow_dispatch:

# 允许 deploy-pages 写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 重复触发时取消旧的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage source
        uses: actions/checkout@v5
        with:
          repository: lishengshang/homepage
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Website
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
