# 构建检查：PR 时跑，确保构建不被破坏
# （push main 的构建与门禁由 Deploy 工作流承担，避免同一提交重复构建）
name: Build

on:
  pull_request:
    branches:
      - main

# 最小权限：PR 构建只需读仓库（不声明时 GITHUB_TOKEN 取仓库默认权限）
permissions:
  contents: read

# 同一分支重复 push 时取消旧的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # 检出 Git 仓库
      - name: Check out git repository
        uses: actions/checkout@v5

      # 安装 pnpm（版本由 package.json 的 packageManager 字段指定）
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # 安装 Node.js
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      # 复制环境变量文件
      - name: Copy .env.example
        run: cp .env.example .env

      # 安装项目依赖
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 静态检查（不带 --fix，仅校验）
      - name: Lint Check
        run: pnpm lint:check

      # 单元测试
      - name: Unit Test
        run: pnpm test

      # 类型检查
      - name: Type Check
        run: pnpm typecheck

      # 构建程序
      - name: Build Website
        run: pnpm build
