# push 到 main 后通知部署仓库（lishengshang.github.io）自动同步构建部署
name: Notify Deployment

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync to lishengshang.github.io
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PUBLISH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "lishengshang",
              repo: "lishengshang.github.io",
              event_type: "sync",
            });
