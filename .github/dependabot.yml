# Dependabot 自动依赖更新配置
version: 2

updates:
  # npm 依赖（生产 + 开发）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # 安全更新优先，小版本自动合并需要 review
    allow:
      - dependency-type: "direct"
    # 大版本升级单独 PR，便于 review
    versioning-strategy: "increase"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    # 非破坏性更新（minor/patch）归并单个 PR，降低周 PR 噪音
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker 基础镜像更新（Dockerfile: node:22-alpine / nginx:alpine）
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
