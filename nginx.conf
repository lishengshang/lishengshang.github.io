server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 构建期已产出 .gz/.br，直接使用预压缩文件
    gzip_static on;

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口与 PWA 关键文件不缓存，保证更新即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
