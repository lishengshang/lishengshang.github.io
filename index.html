<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%VITE_SITE_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_SITE_APPLE_LOGO%" />
    <meta name="description" content="%VITE_SITE_DES%" />
    <meta name="keywords" content="%VITE_SITE_KEYWORDS%" />
    <meta name="author" content="%VITE_SITE_AUTHOR%" />
    <meta name="theme-color" content="#424242" />
    <!-- Open Graph 分享卡片：链接在微信/Telegram/X 等平台展示标题+简介+图 -->
    <!-- 注意：og:url/og:image 由 %VITE_SITE_URL% 拼接 https://，该变量请填不带协议的域名 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_SITE_NAME%" />
    <meta property="og:title" content="%VITE_SITE_NAME%" />
    <meta property="og:description" content="%VITE_SITE_DES%" />
    <meta property="og:url" content="https://%VITE_SITE_URL%/" />
    <meta property="og:image" content="https://%VITE_SITE_URL%/images/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <title>%VITE_SITE_NAME%</title>
    <!-- 字体 CDN 提前建连（DNS+TCP+TLS 与页面解析并行） -->
    <link rel="preconnect" href="https://s1.hdslb.com" crossorigin />
    <!-- HarmonyOS Sans（非阻塞加载：先以系统字体渲染，字体就绪后替换） -->
    <link
      rel="preload"
      as="style"
      href="https://s1.hdslb.com/bfs/static/jinkela/long/font/regular.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://s1.hdslb.com/bfs/static/jinkela/long/font/regular.css" />
    </noscript>
  </head>

  <body>
    <!-- 主体内容 -->
    <div id="app"></div>
    <!-- noscript -->
    <noscript>
      <div style="text-align: center">请开启 JavaScript</div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
